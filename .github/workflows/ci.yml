name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Windows-only: credential handling uses DPAPI, history import uses the registry,
    # and the session state machine relies on mstsc / tasklist.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build native components
        run: npm run build:native

      - name: Build application
        run: npm run build

      - name: Verify (source-level suites, no GUI)
        run: npm run verify
        env:
          CI: true

      - name: Audit production dependencies
        run: npm run audit

  build:
    runs-on: windows-latest
    timeout-minutes: 40
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # electron-builder 解压 winCodeSign 时调用 7za。优先用 7zip-bin 里的二进制，
      # 缺失时退回系统 7-Zip，并确保 PATH 上有一个叫 7za 的可执行文件。
      - name: Prepare 7-Zip
        shell: pwsh
        run: |
          $tools = Join-Path $PWD '.tools'
          New-Item -ItemType Directory -Force $tools | Out-Null
          $src = Join-Path $PWD 'node_modules\7zip-bin\win\x64\7za.exe'
          if (-not (Test-Path $src)) {
            choco install 7zip -y --no-progress
            $src = 'C:\Program Files\7-Zip\7z.exe'
          }
          if (-not (Test-Path $src)) { throw '7-Zip executable not found' }
          Copy-Item $src (Join-Path $tools '7za.exe') -Force
          Add-Content -Path $env:GITHUB_PATH -Value $tools

      - name: Build installer and portable exe
        run: npm run build:win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rdpilot-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/SHA256SUMS.txt
          if-no-files-found: error
