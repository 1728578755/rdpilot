name: 功能建议
description: 提出一个功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的场景
      description: 描述实际使用场景，而不是直接给出实现方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么解决
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该建议不涉及被控端、中继服务器或无人值守访问
          required: true
